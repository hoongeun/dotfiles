$mod = SUPER
$term = ghostty
$lock = pidof hyprlock || hyprlock

monitor = , preferred, auto, 1

source = $HOME/.config/hypr/gpu.conf
env = ELECTRON_OZONE_PLATFORM_HINT,auto

env = GTK_IM_MODULE,ibus
env = QT_IM_MODULE,ibus
env = XMODIFIERS,@im=ibus
env = XCURSOR_SIZE,24

exec-once = dbus-update-activation-environment --systemd --all
exec-once = test ! -f $HOME/.wallpaper.png || swaybg -i $HOME/.wallpaper.png -m fill
exec-once = waybar
exec-once = $HOME/.local/bin/vicinae server
exec-once = dunst
exec-once = nm-applet --indicator
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
exec-once = sh $HOME/.config/hypr/start-ibus.sh
exec-once = hypridle
exec-once = sh $HOME/.config/hypr/start-hy3.sh

input {
    repeat_delay = 300
    repeat_rate = 50
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(cdd6f4aa)
    col.inactive_border = rgba(cdd6f40f)
    layout = hy3
}

decoration {
    rounding = 10
    rounding_power = 2.5
    active_opacity = 1.0
    inactive_opacity = 0.94
    dim_inactive = true
    dim_strength = 0.06

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.015
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.15
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        offset = 0 6
        color = rgba(00000055)
        color_inactive = rgba(00000022)
    }
}

animations {
    enabled = true
    bezier = expo, 0.16, 1, 0.3, 1
    bezier = soft, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 4, expo, popin 94%
    animation = windowsOut, 1, 2.5, soft, popin 94%
    animation = windowsMove, 1, 4, expo
    animation = fade, 1, 3, soft
    animation = fadeDim, 1, 4, soft
    animation = border, 1, 5, soft
    animation = workspaces, 1, 4, expo, slidefade 8%
    animation = specialWorkspace, 1, 4, expo, slidefadevert 12%
    animation = layers, 1, 3, expo, fade
}

# Frosted bar and notifications; ignore_alpha keeps blur off fully transparent edges.
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.3, match:namespace waybar
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.3, match:namespace notifications

plugin {
    hy3 {
        no_gaps_when_only = 0
        tabs {
            height = 4
            padding = 3
        }
    }
}

binds {
    workspace_back_and_forth = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# No gaps or border when a workspace has one tiled window.
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float false, match:workspace w[tv1]
windowrule = rounding 0, match:float false, match:workspace w[tv1]
windowrule = border_size 0, match:float false, match:workspace f[1]
windowrule = rounding 0, match:float false, match:workspace f[1]

windowrule = float on, match:title ^(alsamixer)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(org\.gnome\.Calculator)$

bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, $HOME/.local/bin/vicinae toggle
bind = $mod, F2, exec, brave-browser
bind = $mod, F3, exec, nautilus
bind = $mod CTRL, M, exec, $term -e alsamixer
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%F_%H-%M-%S).png
bindr = $mod SHIFT, D, exec, killall dunst; dunst & notify-send 'restart dunst'

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = $mod, J, hy3:movefocus, l
bind = $mod, K, hy3:movefocus, d
bind = $mod, L, hy3:movefocus, u
bind = $mod, semicolon, hy3:movefocus, r
bind = $mod, Left, hy3:movefocus, l
bind = $mod, Down, hy3:movefocus, d
bind = $mod, Up, hy3:movefocus, u
bind = $mod, Right, hy3:movefocus, r

bind = $mod SHIFT, J, hy3:movewindow, l
bind = $mod SHIFT, K, hy3:movewindow, d
bind = $mod SHIFT, L, hy3:movewindow, u
bind = $mod SHIFT, semicolon, hy3:movewindow, r
bind = $mod SHIFT, Left, hy3:movewindow, l
bind = $mod SHIFT, Down, hy3:movewindow, d
bind = $mod SHIFT, Up, hy3:movewindow, u
bind = $mod SHIFT, Right, hy3:movewindow, r

bind = $mod, B, workspace, previous
bind = $mod SHIFT, B, movetoworkspace, previous

# hy3: i3-style containers; H/V wrap the focused window in a new container.
bind = $mod, H, hy3:makegroup, h
bind = $mod, V, hy3:makegroup, v
bind = $mod, Q, hy3:changegroup, opposite
bind = $mod, E, hy3:changegroup, opposite
bind = $mod, W, hy3:changegroup, toggletab
bind = $mod, S, hy3:changegroup, toggletab
bind = $mod, A, hy3:changefocus, raise
bind = $mod SHIFT, A, hy3:changefocus, lower
bind = $mod, Tab, hy3:focustab, r, wrap
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, space, togglefloating
bind = $mod SHIFT, S, pin
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad
bind = $mod CTRL, Right, workspace, e+1
bind = $mod CTRL, Left, workspace, e-1

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exec, zenity --question --text 'Exit Hyprland? This ends your Wayland session.' && hyprctl dispatch exit

bind = $mod, 9, exec, $lock
bind = $mod, 0, submap, system
submap = system
bind = , L, exec, $lock
bind = , L, submap, reset
bind = , E, exit
bind = , S, exec, systemctl suspend
bind = , S, submap, reset
bind = , R, exec, systemctl reboot
bind = SHIFT, S, exec, systemctl poweroff
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

bind = $mod, R, submap, resize
submap = resize
binde = , J, resizeactive, -20 0
binde = , K, resizeactive, 0 20
binde = , L, resizeactive, 0 -20
binde = , semicolon, resizeactive, 20 0
binde = , Left, resizeactive, -40 0
binde = , Down, resizeactive, 0 40
binde = , Up, resizeactive, 0 -40
binde = , Right, resizeactive, 40 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
