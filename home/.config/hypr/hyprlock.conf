general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 6, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 4, easeOutQuint
    animation = inputFieldWidth, 1, 4, easeOutQuint
    animation = inputFieldFade, 1, 4, easeOutQuint
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.65
    contrast = 0.9
    vibrancy = 0.15
}

label {
    monitor =
    text = $TIME
    font_family = Noto Sans CJK KR
    font_size = 96
    color = rgba(cdd6f4ff)
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%-m월 %-d일 %A'
    font_family = Noto Sans CJK KR
    font_size = 16
    color = rgba(cdd6f4b3)
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 40
    position = 0, -90
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    hide_input = false

    outer_color = rgba(cdd6f433)
    inner_color = rgba(1e1e2e66)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    capslock_color = rgba(fab387ff)
    fail_text = $ATTEMPTS
}
